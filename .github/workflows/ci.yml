name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify JSON Schemas
        run: cargo run --package xtask -- verify-schemas

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Verify Repository
        run: cargo run --package xtask -- verify

  rust-analyzer-acceptance:
    needs: check-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain and rust-analyzer
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rust-analyzer
          rustup default 1.98.1
          rust-analyzer --version

      - name: Run explicit rust-analyzer function acceptance proof
        env:
          OMEN_REQUIRE_SEMANTIC_EXTERNAL_PROOFS: "1"
        run: cargo test -p omen-cli --test semantic_environment_proofs test_proof_c_real_lsp_symbol_definition_and_references -- --exact --nocapture

  matrix-test:
    needs: check-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rust-analyzer
          rustup default 1.98.1

      - name: Restore Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build Test Fixtures
        run: cargo build --bin omen-gremlin

      - name: Run Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Run Windows rust-analyzer cold-start acceptance proof
        if: runner.os == 'Windows'
        env:
          OMEN_REQUIRE_SEMANTIC_EXTERNAL_PROOFS: "1"
        run: cargo test -p omen-cli --test semantic_environment_proofs test_proof_c_real_lsp_symbol_definition_and_references -- --exact --nocapture

  windows-preview-candidate:
    needs: check-and-lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Build exact Windows candidate
        run: cargo run --package xtask -- preview package --ci-run-id ${{ github.run_id }}
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: omen-preview-candidate-windows-x86_64
          path: work/omen-*-windows-x86_64.zip
