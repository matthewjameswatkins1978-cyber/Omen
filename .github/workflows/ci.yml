name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify JSON Schemas
        run: cargo run --package xtask -- verify-schemas

      - name: Verify Repository
        run: cargo run --package xtask -- verify

  rust-analyzer-acceptance:
    needs: check-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain and rust-analyzer
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rust-analyzer
          rustup default 1.98.1
          rust-analyzer --version

      - name: Run explicit rust-analyzer function acceptance proof
        env:
          OMEN_REQUIRE_SEMANTIC_EXTERNAL_PROOFS: "1"
        run: cargo test -p omen-cli --test semantic_environment_proofs test_proof_c_real_lsp_symbol_definition_and_references -- --exact --nocapture

  matrix-test:
    needs: check-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Build Test Fixtures
        run: cargo build --bin omen-gremlin

      - name: Run Workspace Tests
        run: cargo test --workspace --all-targets
