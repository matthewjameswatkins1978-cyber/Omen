[workspace]
resolver = "3"
members = [
    "crates/omen-core",
    "crates/omen-schema",
    "crates/omen-engine",
    "crates/omen-knowledge",
    "crates/omen-atlas",
    "crates/omen-adapters",
    "crates/omen-ui",
    "crates/omen-interactive",
    "crates/omen-ipc",
    "crates/omen-daemon",
    "crates/omen-client",
    "crates/omen-cli",
    "crates/omen-agent",
    "crates/omen-mcp",
    "crates/omen-test-fixtures",
    "crates/omen-semantic",
    "crates/xtask",
]
exclude = [
    "tests/fixtures/auth_project",
]

[workspace.package]
version = "0.9.0-preview.4"
edition = "2024"
rust-version = "1.98.1"
publish = false
authors = ["Matthew James Watkins <matthewjameswatkins1978@cyber.net>"]
repository = "https://github.com/matthewjameswatkins1978-cyber/Omen"

[workspace.dependencies]
omen-core = { path = "crates/omen-core", version = "0.9.0-preview.4" }
omen-schema = { path = "crates/omen-schema", version = "0.9.0-preview.4" }
omen-engine = { path = "crates/omen-engine", version = "0.9.0-preview.4" }
omen-knowledge = { path = "crates/omen-knowledge", version = "0.9.0-preview.4" }
omen-atlas = { path = "crates/omen-atlas", version = "0.9.0-preview.4" }
omen-adapters = { path = "crates/omen-adapters", version = "0.9.0-preview.4" }
omen-ui = { path = "crates/omen-ui", version = "0.9.0-preview.4" }
omen-interactive = { path = "crates/omen-interactive", version = "0.9.0-preview.4" }
omen-ipc = { path = "crates/omen-ipc", version = "0.9.0-preview.4" }
omen-daemon = { path = "crates/omen-daemon", version = "0.9.0-preview.4" }
omen-client = { path = "crates/omen-client", version = "0.9.0-preview.4" }
omen-agent = { path = "crates/omen-agent", version = "0.9.0-preview.4" }
omen-mcp = { path = "crates/omen-mcp", version = "0.9.0-preview.4" }
omen-test-fixtures = { path = "crates/omen-test-fixtures", version = "0.9.0-preview.4" }
omen-semantic = { path = "crates/omen-semantic", version = "0.9.0-preview.4" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.33", features = ["bundled"] }
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
tempfile = "3.17"
notify = "8.0"
chrono = { version = "0.4", features = ["serde"] }
reedline = "0.51.0"
crossterm = "0.29.0"
nu-ansi-term = "0.50.3"
fuzzy-matcher = "0.3.7"
uuid = { version = "1.15", features = ["v4"] }
prost = "0.13"
