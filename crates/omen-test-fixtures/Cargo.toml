[package]
name = "omen-test-fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "omen-gremlin"
path = "src/bin/omen-gremlin.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
crossterm = { workspace = true }
serde_json = { workspace = true }

# Existing workspace dependency; POSIX gremlin modes only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = [
    "process",
    "fs",
    "pty",
    "termios",
] }

