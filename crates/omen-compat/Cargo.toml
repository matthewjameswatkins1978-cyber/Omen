[package]
name = "omen-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# Test-only observation boundary for IDO No. 2. Production crates must never
# depend on this crate.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Existing workspace dependency newly used by omen-compat for bounded
# cancellable child I/O only (not a new third-party crate).
tokio = { workspace = true, features = [
    "process",
    "io-util",
    "time",
    "rt",
    "macros",
    "sync",
] }

[dev-dependencies]
omen-test-fixtures = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "process",
    "io-util",
    "time",
    "rt",
    "macros",
    "sync",
] }
# Product under test for engine ConPTY scenarios only (Windows M0-W).
# No production crate may depend on omen-compat.
[target.'cfg(windows)'.dev-dependencies]
omen-engine = { workspace = true }
omen-core = { workspace = true }

# Existing workspace dependency (already used by omen-engine/omen-ipc).
# Newly used by omen-compat for POSIX PTY/termios/process observation only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.0", features = [
    "process",
    "fs",
    "pty",
    "termios",
    "event",
] }

# Existing workspace dependency; Windows ConPTY control harness only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
] }
